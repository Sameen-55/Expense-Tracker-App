<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="6" width="20" height="14" rx="3" stroke="currentColor" stroke-width="2" />
              <path d="M2 10h20" stroke="currentColor" stroke-width="2" />
              <circle cx="16.5" cy="15.5" r="1.5" fill="currentColor" />
            </svg>
          </span>
          <div>
            <h1>Personal Expense Tracker</h1>
            <p>Track, edit, and review your spending in one place.</p>
          </div>
        </div>
        <button type="button" id="yolo-toggle" class="yolo-toggle" aria-pressed="false">
          YOLO Mode: Off
        </button>
      </header>

      <section class="summary-card" aria-live="polite">
        <p class="summary-label">Total Expenses</p>
        <p class="summary-value" id="total-amount">$0.00</p>
      </section>

      <section class="card">
        <h2 id="form-heading">Add Expense</h2>
        <form id="expense-form" novalidate>
          <div class="form-grid">
            <label>
              Title
              <input type="text" id="title" name="title" placeholder="e.g. Grocery shopping" required />
            </label>
            <label>
              Amount
              <input type="number" id="amount" name="amount" min="0.01" step="0.01" placeholder="0.00" required />
            </label>
            <label>
              Category
              <select id="category" name="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
              </select>
            </label>
          </div>
          <p class="form-error" id="form-error" hidden></p>
          <div class="form-actions">
            <button type="submit" id="submit-btn">Add Expense</button>
            <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
          </div>
          <p class="storage-status" id="storage-status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>All Expenses</h2>
          <button type="button" id="clear-all-btn" class="clear-btn" disabled>
            Clear All
          </button>
        </div>
        <div class="filters-grid">
          <label>
            Search by title
            <input type="search" id="search-title" placeholder="Search expenses..." autocomplete="off" />
          </label>
          <label>
            Filter by category
            <select id="filter-category">
              <option value="">All categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Other">Other</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table id="expense-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expense-list"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
